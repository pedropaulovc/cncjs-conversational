name: Release and publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test package
        run: npm test

      - name: Check package contents
        run: npm run pack:check

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected_tag"

      - name: Extract release notes from the changelog
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="${PACKAGE_VERSION#v}"
          awk -v heading="## [$PACKAGE_VERSION]" '
            $0 == heading || index($0, heading " - ") == 1 {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END {
              if (!found) {
                print "Missing changelog section: " heading > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --verify-tag
